name: Temizle
options:
  bundleIdPrefix: com.tfs
  deploymentTarget:
    iOS: "16.0"
targets:
  Temizle:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tfs.temizle
        PRODUCT_NAME: Temizle
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Temizle
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fotoğraf ve videolarınızı gözden geçirip istemediklerinizi silebilmeniz için galeri erişimi gerekiyor."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
