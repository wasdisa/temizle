name: iOS IPA olustur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode surumu
        run: xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini olustur
        run: xcodegen generate

      - name: Derle (imzasiz)
        run: |
          set -o pipefail
          xcodebuild -project Temizle.xcodeproj \
            -target Temizle \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Release-iphoneos/Temizle.app

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Temizle.app Payload/
          zip -qry Temizle.ipa Payload
          ls -lh Temizle.ipa

      - name: IPA dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Temizle-ipa
          path: Temizle.ipa

      - name: Hata durumunda derleme kaydini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
